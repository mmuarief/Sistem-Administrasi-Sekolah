<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generator Jurnal Guru Harian – Kurikulum Merdeka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1fb;--paper:#fff;--tx:#17203d;--mu:#56608a;--pri:#263b8f;--pri-tx:#fff;--tint:#f4f6fe;--yel:#ffc93c;--red:#e8453c;--line:#17203d;--rule:#dbe1f5;--chip:#e4e9fb;box-sizing:border-box}
:root[data-theme="dark"]{--bg:#0e1330;--paper:#171f47;--tx:#eef1ff;--mu:#a5aed6;--pri:#9db0ff;--pri-tx:#0e1330;--tint:#1c2552;--line:#04061a;--rule:#2b366b;--chip:#26306a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:18px;background-image:radial-gradient(var(--rule) 1.2px,transparent 1.2px);background-size:22px 22px}
.wrap{max-width:1240px;margin:0 auto}
.hero{background:var(--pri);color:var(--pri-tx);border:2px solid var(--line);border-radius:18px;box-shadow:6px 6px 0 var(--line);padding:26px 28px;margin-bottom:22px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:var(--yel);opacity:.95}
.hero:before{content:"";position:absolute;right:70px;bottom:-40px;width:90px;height:90px;border-radius:50%;background:var(--red)}
.hero>*{position:relative;z-index:1}
.badge{display:inline-block;background:var(--yel);color:#17203d;border:2px solid var(--line);border-radius:999px;padding:3px 14px;font-weight:700;font-size:.8rem;margin-bottom:10px}
h1{font:800 clamp(1.8rem,5vw,2.9rem)/1.05 "Bricolage Grotesque","Public Sans",system-ui,sans-serif;margin:0 0 8px;letter-spacing:-.02em;max-width:14ch}
p.sub{margin:0;max-width:44ch;opacity:.92}
.card{background:var(--paper);border:2px solid var(--line);border-radius:16px;box-shadow:5px 5px 0 var(--line);padding:20px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label{display:block;font-size:.82rem;font-weight:700;margin-bottom:4px}
input,select{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--tint);color:var(--tx);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button{background:var(--yel);color:#17203d;border:2px solid var(--line);border-radius:12px;padding:10px 18px;font:700 .95rem "Public Sans",system-ui,sans-serif;cursor:pointer;box-shadow:3px 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
button.alt{background:var(--paper);color:var(--tx)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.meta span{background:var(--chip);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:600;font-size:.82rem}
.scroll{overflow-x:auto;border:2px solid var(--line);border-left:6px solid var(--red);border-radius:12px;background:var(--paper)}
table{border-collapse:collapse;width:100%;min-width:1100px;font-size:.86rem}
th{background:var(--pri);color:var(--pri-tx);padding:12px 10px;text-align:left;font:700 .85rem "Bricolage Grotesque","Public Sans",sans-serif;border-right:1px solid rgba(255,255,255,.25)}
td{padding:12px 10px;vertical-align:top;border-bottom:1px solid var(--rule);border-right:1px dashed var(--rule)}
tbody tr:nth-child(even) td{background:var(--tint)}
tbody tr:last-child td{border-bottom:0}
td:focus{outline:2px solid var(--red);outline-offset:-2px;background:var(--paper)}
td.c{text-align:center;width:70px}
.no{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--yel);color:#17203d;border:2px solid var(--line);font:800 1.1rem "Bricolage Grotesque",sans-serif}
.hint{color:var(--mu);font-size:.82rem;margin-top:10px}
textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--tint);color:var(--tx);font:inherit}
.tabs{display:flex;gap:10px;margin:0 0 20px}
.card h2{margin:0 0 12px;font:800 1.25rem "Bricolage Grotesque",sans-serif}
.kop{text-align:center;margin-bottom:14px}.kop h2{font:800 1.4rem "Bricolage Grotesque",sans-serif;margin:0 0 6px}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:2px 16px;text-align:left;font-size:.88rem}
.sign{display:flex;justify-content:space-around;gap:20px;margin-top:26px;text-align:center;flex-wrap:wrap}
.wrap[data-tab="pr"] .jr{display:none}.wrap:not([data-tab="pr"]) .pr{display:none}
td.ab{text-align:center;cursor:pointer;font-weight:700;user-select:none;width:46px}
.sH{color:#1c7a45}.sS{color:#b8860b}.sI{color:#2d6cdf}.sA{color:var(--red)}
td input{width:100%;min-width:180px;padding:6px 8px}
button.del{padding:2px 12px;font-size:1.2rem;line-height:1.3;background:var(--red);color:#fff;box-shadow:2px 2px 0 var(--line)}
@media print{body{background:#fff;background-image:none;color:#000;padding:0}.noprint{display:none}.card{border:0;box-shadow:none;padding:0}.scroll{border:1px solid #000;border-left:1px solid #000}table{min-width:0;font-size:9pt}th{background:#eee!important;color:#000;-webkit-print-color-adjust:exact}td{border:1px solid #999}tbody tr:nth-child(even) td{background:#fff}.no{border:1px solid #000;background:#fff}.meta span{border:1px solid #000;background:#fff}@page{size:A4 landscape;margin:12mm}}
</style>
</head>
<body>
<div class="wrap">
  <div class="noprint">
    <header class="hero"><span class="badge">Kurikulum Merdeka</span><h1>Jurnal Guru Harian</h1><p class="sub">Isi datanya, buat jurnalnya, lalu sunting langsung di tabel.</p></header>
    <nav class="tabs noprint"><button class="tab" data-t="jr">Jurnal</button><button class="tab alt" data-t="pr">Presensi &amp; Catatan</button></nav>
    <div class="card jr">
      <div class="grid">
        <div><label>Mata Pelajaran</label><input id="mapel" value="Matematika"></div>
        <div><label>Kelas / Fase</label><input id="kelas" value="VII / Fase D"></div>
        <div><label>Semester</label><select id="smt"><option>Ganjil</option><option>Genap</option></select></div>
        <div><label>Materi / Topik</label><input id="materi" value="Teks Deskripsi"></div>
        <div><label>Jumlah Pertemuan</label><input id="n" type="number" min="1" max="12" value="4"></div>
        <div><label>Alokasi Waktu / Pertemuan</label><input id="waktu" value="2 JP (2 × 40 menit)"></div>
      </div>
      <div class="grid" style="margin-top:14px">
        <div><label>Nama Guru</label><input id="guru" placeholder="Nama lengkap, gelar"></div>
        <div><label>NIP / NUPTK</label><input id="nip"></div>
        <div><label>Satuan Pendidikan</label><input id="sekolah" placeholder="Nama sekolah"></div>
        <div><label>Tahun Ajaran</label><input id="tahun" value="2026/2027"></div>
        <div><label>Kepala Sekolah</label><input id="kepsek"></div>
        <div><label>Model Pembelajaran</label><select id="model"><option>Tanpa model khusus</option><option>Problem Based Learning (PBL)</option><option>Project Based Learning (PjBL)</option><option>Discovery Learning</option></select></div>
        <div><label>Capaian Pembelajaran (CP)</label><input id="cp" placeholder="Ringkasan CP"></div>
        <div><label>Profil Pelajar Pancasila</label><input id="profil" placeholder="mis. Bernalar kritis, Gotong royong"></div>
      </div>
      <div class="btns">
        <button id="go">Buat Jurnal</button>
        <button class="alt" id="print">Cetak / Simpan PDF</button>
        <button class="alt" id="saveWord">Simpan Word (.doc)</button>
        <button class="alt" id="saveExcel">Simpan Excel (.xls)</button>
        <button class="alt" id="copy">Salin untuk Word</button>
        <button class="alt" id="theme">Mode Gelap</button>
      </div>
      <div class="hint" id="msg"></div>
    </div>
  </div>
  <div class="card jr" id="out"></div>
  <div class="card pr">
    <h2>Presensi &amp; Catatan Siswa</h2>
    <label>Daftar nama siswa (satu nama per baris)</label>
    <textarea id="names" rows="6"></textarea>
    <label style="margin-top:14px">Jumlah pertemuan presensi (P1, P2, ...)</label>
    <input id="np" type="number" min="1" max="60" value="4" style="max-width:180px">
    <div class="btns">
      <button id="mkp">Buat Daftar</button>
      <button class="alt" id="savePresensi">📤 Simpan Presensi (.csv)</button>
      <button class="alt" id="copyPresensi">📋 Salin untuk Excel (dengan Rumus)</button>
    </div>
    <p class="hint">Klik kotak kehadiran untuk mengganti: H (Hadir), S (Sakit), I (Izin), A (Alpa).</p>
    <div id="ptab"></div>
  </div>
</div>
<script src="jurnal-guru-harian.js"></script>
</body>
</html>
